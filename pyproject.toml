[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "voice-rag"
version = "0.1.0"
description = "Voice-Enabled RAG for Indian Languages (ai4bharat/MSMARCO-XI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Core ML
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "sentence-transformers>=3.1.0",
    "optimum[onnxruntime-gpu]>=1.21.0",
    "FlagEmbedding>=1.2.11",

    # Vector DB
    "qdrant-client>=1.10.0",
    "fastembed>=0.3.6",

    # Orchestration
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",

    # Indic NLP
    "indic-nlp-library>=0.92",
    "indicnlp @ git+https://github.com/anoopkunchukuttan/indic_nlp_library.git",

    # Dataset
    "datasets>=2.21.0",
    "huggingface-hub>=0.24.0",

    # API & Web
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # Observability
    "numpy>=1.26.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",

    # Utilities
    "tqdm>=4.66.0",
    "tenacity>=8.5.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["voice_rag*", "config*", "ingestion*", "retrieval*", "generation*", "guardrails*", "orchestration*", "voice*", "evaluation*", "observability*", "api*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
