version: '3.8'

services:
  # 1. Main RAG Application
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: voice_rag_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # HuggingFace cache settings
      - HF_HOME=/root/.cache/huggingface
      # API Settings
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - API_WORKERS=4
      # Service endpoints
      - QDRANT_URL=http://qdrant:6333
      - LLM_BASE_URL=http://vllm:8000/v1
      # Sarvam STT config
      - SARVAM_API_KEY=${SARVAM_API_KEY}
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
      - vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 2. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    restart: always
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    # No GPU required for Qdrant storage

  # 3. vLLM Generation Engine
  vllm:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    container_name: vllm_server
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - hf_cache:/root/.cache/huggingface
    # vLLM exposes /health endpoint we can wait for
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Allocate a dedicated GPU if running on multi-GPU setup, 
    # or share with the API container (which runs smaller encoder models).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qdrant_data:
  hf_cache:
